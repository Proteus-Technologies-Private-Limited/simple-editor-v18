<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Editor - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .error-alert {
            background-color: #fee2e2;
            border: 1px solid #ef4444;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-alert {
            background-color: #d1fae5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            color: #374151;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.invalid {
            border-color: #ef4444;
        }

        .login-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .login-button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-button.loading .spinner {
            display: inline-block;
        }

        .login-button.loading .btn-text {
            display: none;
        }

        .login-button .loading-text {
            display: none;
        }

        .login-button.loading .loading-text {
            display: inline;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .editor-params {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .editor-params summary {
            cursor: pointer;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Simple Editor</h1>
            <p>Please sign in to continue</p>
        </div>

        <div id="errorAlert" class="error-alert"></div>
        <div id="successAlert" class="success-alert"></div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="USER_CODE">User Code</label>
                <input type="text" id="USER_CODE" name="USER_CODE" placeholder="Enter your user code" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="PASSWORD">Password</label>
                <input type="password" id="PASSWORD" name="PASSWORD" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <input type="hidden" id="APP_ID" name="APP_ID" value="FLUTTERAPP">

            <details class="editor-params">
                <summary>Editor Parameters (Optional)</summary>
                <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
                    <div class="form-group">
                        <label for="OBJ_NAME">Object Name</label>
                        <input type="text" id="OBJ_NAME" name="OBJ_NAME" value="sorder" placeholder="e.g., sorder">
                    </div>
                    <div class="form-group">
                        <label for="EDIT_FLAG">Edit Flag</label>
                        <input type="text" id="EDIT_FLAG" name="EDIT_FLAG" value="A" placeholder="A for Add, E for Edit">
                    </div>
                </div>
            </details>

            <button type="submit" id="loginBtn" class="login-button">
                <span class="spinner"></span>
                <span class="btn-text">Sign In</span>
                <span class="loading-text">Signing in...</span>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        // Check if already logged in
        const storedToken = sessionStorage.getItem('TOKEN_ID');
        if (storedToken) {
            showSuccess('Already logged in. Redirecting...');
            setTimeout(() => {
                redirectToEditor();
            }, 1000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlerts();

            const formData = new URLSearchParams();
            formData.append('USER_CODE', document.getElementById('USER_CODE').value);
            formData.append('PASSWORD', document.getElementById('PASSWORD').value);
            formData.append('APP_ID', 'FLUTTERAPP');
            formData.append('IS_PWD_ENCRYPT', 'false');
            formData.append('DATA_FORMAT', 'JSON');

            setLoading(true);

            try {
                const response = await fetch('http://localhost:9090/ibase/rest/E12ExtService/loginApp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString(),
                    credentials: 'include'
                });

                // Debug: Log all response headers
                console.log('Response status:', response.status);
                console.log('Response headers:');
                response.headers.forEach((value, key) => {
                    console.log(`  ${key}: ${value}`);
                });

                // Capture JSESSIONID from response header (set by proxy)
                const jsessionIdFromHeader = response.headers.get('X-JSESSIONID');
                console.log('X-JSESSIONID header value:', jsessionIdFromHeader);

                if (jsessionIdFromHeader) {
                    sessionStorage.setItem('JSESSIONID', jsessionIdFromHeader);
                    console.log('JSESSIONID stored in sessionStorage:', jsessionIdFromHeader);
                } else {
                    console.warn('X-JSESSIONID header not found in response');
                }

                const text = await response.text();
                console.log('Login response:', text);

                // Try to parse as JSON first
                let data;
                let tokenId = null;

                try {
                    data = JSON.parse(text);
                    console.log('Parsed JSON:', data);

                    // Check various possible token field names
                    tokenId = data.TOKEN_ID || data.token_id || data.tokenId ||
                              data.token || data.sessionToken || data.access_token;

                    // Check if token is nested in a data or result object
                    if (!tokenId && data.data) {
                        tokenId = data.data.TOKEN_ID || data.data.token_id || data.data.tokenId;
                    }
                    if (!tokenId && data.result) {
                        tokenId = data.result.TOKEN_ID || data.result.token_id || data.result.tokenId;
                    }

                } catch (e) {
                    console.log('Not JSON, trying other formats...');
                    // If not JSON, check if it's XML or plain text with TOKEN_ID
                    if (text.includes('TOKEN_ID') || text.includes('token')) {
                        // Extract TOKEN_ID from response
                        const tokenMatch = text.match(/TOKEN_ID[=:"\s]+([^"'\s<>,}]+)/i) ||
                                          text.match(/token[_]?[iI]d[=:"\s]+([^"'\s<>,}]+)/i);
                        if (tokenMatch) {
                            tokenId = tokenMatch[1];
                        }
                    }
                }

                if (tokenId) {
                    // Store token
                    sessionStorage.setItem('TOKEN_ID', tokenId);
                    console.log('Token stored:', tokenId);

                    // Store JSESSIONID if available
                    const jsessionId = data?.JSESSIONID || data?.jsessionId || data?.sessionId || '';
                    if (jsessionId) {
                        sessionStorage.setItem('JSESSIONID', jsessionId);
                        console.log('JSESSIONID stored:', jsessionId);
                    }

                    if (data?.USER_NAME || data?.userName || data?.user_name) {
                        sessionStorage.setItem('USER_NAME', data.USER_NAME || data.userName || data.user_name);
                    }

                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        redirectToEditor();
                    }, 1000);
                } else if (response.ok) {
                    // Response was OK but no TOKEN_ID found
                    // Check if login was actually successful based on response content
                    if (data && (data.status === 'success' || data.success === true || data.code === 200)) {
                        showSuccess('Login successful! Redirecting...');
                        setTimeout(() => {
                            redirectToEditor();
                        }, 1000);
                    } else {
                        showError('Login failed: Could not find token in response. Check console for details.');
                        console.log('Full response:', text);
                        console.log('Parsed data:', data);
                    }
                } else {
                    showError('Login failed: ' + (data?.message || data?.error || 'Invalid credentials'));
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed: ' + error.message);
            } finally {
                setLoading(false);
            }
        });

        function redirectToEditor() {
            const objName = document.getElementById('OBJ_NAME').value || 'sorder';
            const editFlag = document.getElementById('EDIT_FLAG').value || 'A';
            const tokenId = sessionStorage.getItem('TOKEN_ID');

            // Redirect to simpleEditor.html with parameters
            const params = new URLSearchParams({
                OBJ_NAME: objName,
                EDIT_FLAG: editFlag,
                TOKEN_ID: tokenId
            });

            window.location.href = '/simpleEditor.html?' + params.toString();
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            if (loading) {
                loginBtn.classList.add('loading');
            } else {
                loginBtn.classList.remove('loading');
            }
        }

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            successAlert.style.display = 'none';
        }

        function showSuccess(message) {
            successAlert.textContent = message;
            successAlert.style.display = 'block';
            errorAlert.style.display = 'none';
        }

        function hideAlerts() {
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
        }
    </script>
</body>
</html>
