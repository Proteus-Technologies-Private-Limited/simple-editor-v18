          </ngx-treeview>
        </div>
        <div *ngIf="itemTemplate == 'left-expand'" class="treeview-LExpand">
          <ngx-treeview [config]="config" [items]="items" [itemTemplate]='itemTemplateLExpand'  (filterChange)="onFilterChange($event)" (selectedChange)="onSelectedChange($event)">
          </ngx-treeview>
        </div>
        <div *ngIf="itemTemplate == 'right-expand'" class="treeview-RExpand">
          <ngx-treeview [config]="config" [items]="items" [itemTemplate]='itemTemplateRExpand'  (filterChange)="onFilterChange($event)" (selectedChange)="onSelectedChange($event)">
          </ngx-treeview>
        </div>
        <div *ngIf="itemTemplate == 'multi-key-expand'" class="treeview-RExpand">
          <ngx-treeview [config]="config" [items]="items" [itemTemplate]='defaultTemplate'  (filterChange)="onFilterChange($event)" (selectedChange)="onSelectedChange($event)">
          </ngx-treeview>
        </div>
        <!--  <div *ngIf="itemTemplate == 'Feed'">
           <ngx-treeview [config]="config" [items]="items" [itemTemplate]='itemTemplateFeed'>
          </ngx-treeview> 
        </div> -->

  </div>

<ng-template #itemTemplateSimple let-item="item" let-onCollapseExpand="onCollapseExpand" let-onCheckedChange="onCheckedChange">
  <div class="form-inline row-item">
    <i *ngIf="item.children" (click)="onCollapseExpand()" aria-hidden="true" 
      class="fa" 
      [class.fa-caret-right]="item.collapsed"
      [class.fa-caret-down]="!item.collapsed"></i>
    <div class="form-check">
      <input type="checkbox" class="form-check-input" 
        [(ngModel)]="item.checked" 
        (ngModelChange)="onCheckedChange()" 
        [disabled]="item.disabled"
        [indeterminate]="item.indeterminate" />

      <label class="form-check-label" (click)="item.checked = !item.checked; onCheckedChange()">
        {{item.text}}
      </label>
    </div>
  </div>
</ng-template>

<ng-template #itemTemplateLExpand let-item="item" let-onCollapseExpand="onCollapseExpand" let-onCheckedChange="onCheckedChange">
  <div class="form-inline row-item">
    <i *ngIf="item.children" (click)="onCollapseExpand()" aria-hidden="true" 
      class="fa" 
      [class.fa-caret-right]="item.collapsed"
      [class.fa-caret-down]="!item.collapsed"></i>
    <div class="form-check" [class.form-check-leaf]="!item.children">
      <input type="checkbox" class="form-check-input" 
        [(ngModel)]="item.checked" 
        (ngModelChange)="onCheckedChange()" 
        [disabled]="item.disabled"
        [indeterminate]="item.indeterminate" />

      <label class="form-check-label" (click)="item.checked = !item.checked; onCheckedChange()">
        <div class="avatar">
          <span class="avatar-icon">{{item.itemData.empname.charAt(0).toUpperCase()}}</span>
          <i *ngIf="item.checked"  aria-hidden="true" class="fa fa-check"></i>
          <i *ngIf="item.indeterminate"  aria-hidden="true" class="fa fa-indeterminate"></i>
          <div class="avatar-text-content">
            <span class="avatar-text">{{item.itemData.empname}}</span>
            <span class="avatar-sub-text">{{item.itemData.designation}}</span>
          </div>
        </div>
      </label>
    </div>
  </div>
</ng-template>


<ng-template #itemTemplateRExpand let-item="item" let-onCollapseExpand="onCollapseExpand" let-onCheckedChange="onCheckedChange">
  <div class="form-inline row-item">
    <i *ngIf="item.children" (click)="onCollapseExpand()" aria-hidden="true" 
      class="fa" 
      [class.fa-caret-right]="item.collapsed"
      [class.fa-caret-down]="!item.collapsed"></i>
    <div class="form-check">
      <input type="checkbox" class="form-check-input" 
        [(ngModel)]="item.checked" 
        (ngModelChange)="onCheckedChange()" 
        [disabled]="item.disabled"
        [indeterminate]="item.indeterminate" />

      <label class="form-check-label" (click)="item.checked = !item.checked; onCheckedChange()">
        <div class="avatar">
          <i *ngIf="item.checked"  aria-hidden="true" class="fa fa-check"></i>
          <i *ngIf="item.indeterminate"  aria-hidden="true" class="fa fa-indeterminate"></i> 
          <span class="avatar-icon">{{item.itemData.text?.charAt(0).toUpperCase()}}</span>
          
       	  <div applyTemplate class="display_template"  [shHtml] = "layoutTemplate || defaultTemplate " [data] ="item" > </div>
<!--           <span class="avatar-icon">{{item.itemData.empname.charAt(0).toUpperCase()}}</span> -->
<!--           <div class="avatar-text-content"> -->
<!--             <span class="avatar-text">{{item.itemData.empname}}</span> -->
<!--             <span class="avatar-sub-text">{{item.itemData.designation}}</span> -->
<!--           </div> -->
        </div>
      </label>
    </div>
  </div>
</ng-template>

<ng-template #defaultTemplate let-item="item" let-onCollapseExpand="onCollapseExpand" let-onCheckedChange="onCheckedChange">
  <div class="form-inline row-item" (click)="onCollapseExpand()">
    <i *ngIf="item.children"  aria-hidden="true" 
      class="fa" 
      [class.fa-caret-right]="item.collapsed"
      [class.fa-caret-down]="!item.collapsed"
      [style.float]="expansioIconPos   ?  expansioIconPos : 'right'"
      ></i>
    <div class="multilevel-form-check" [ngClass]="expansioIconPos=='left' ? 'expansionIcon' : ''" [class.form-check-leaf]="!item.children">
    	<div applyTemplate class="display_template"  [itemTemplates]="itemTemplates" [data] ="item" > </div> 
    </div>
  </div>
</ng-template>
