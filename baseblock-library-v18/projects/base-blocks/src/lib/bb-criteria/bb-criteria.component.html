                <img *ngIf=" metadataName != 'BI-FILTER'" src="/ibase/Insight/angplugin/assets/images/Close.svg" class="imgalignment" style="height: 12px; width: 12px; margin: 0px;" (click)="closeFilter($event);">

		<div class="filter-body-container">
		  <div *ngFor = " let filter of filters" style="display: flex; align-items: flex-start; width: 100%; margin-bottom: 15px;">

           <!-- Changed by Samruddhi for hidden field in criteria component -->
          <!-- Added by Sujan for between operator [Start]-->
            <div *ngIf = "filter['operator'] == 'between'" style="width: 100%" >
                <div style="display: flex;"> 
                  <div *ngIf = "filter['hidden'] != 'Y'" class="filterIcon" id="filterIconContainer">

                  </div>
                </div>
             </div>
          <!-- Added by Sujan for between operator [Start]-->
            <div  style="display: flex; width: 100%;" *ngIf = "filter['operator'] != 'between'">
                  <div *ngIf = "filter['hidden'] != 'Y'" class="filterIcon" id="filterIconContainer">
                      <img [src]="getImgSrc(filter['type'],filter['multi_opt'])" style="height: 32px; width: 32px; margin: 0px;" [hidden]="!getImgSrc(filter['type'],filter['multi_opt'])">

        <div class="footerBtn">

                <img *ngIf=" metadataName === 'BI-FILTER'" src="assets/images/Done.svg" class="cursor" style="height: 12px;" (click)="applyFilter($event);">
                <div (click)="applyFilter($event);" class="doneCursor">Done</div>
            </div>
        </div>

</ng-template>

<ng-template #mobile>
  <div class="filter-container">
	<div class="filter-header-container">
    <span class="filter-title">
      Search Scope
    </span>
   </div>
  <div class="filter-body-container-mobile">
    <div *ngFor = " let filter of filters" > 
      <bb-criteria-input [filterInfo]= 'filter' [metadataName]="metadataName"  [fromDate]="fromDateInput"  [toDate]="toDateInput" [dateFormat]="dateFormat" (valueChange)="updateFilterParam($event);"></bb-criteria-input>
    </div>
  </div>
  <div class = "filter-footer-container">
    <table style="width: 100%;">
      <tr>
        <td align="left" width="20%">
          <bb-button class = "filter-Buttons" [uxDesign]="'UX3'" [appearance]="'simple'" (click)="closeFilter($event);">
              <mat-icon><i class="material-icons filter-action filter-Buttons" >close </i> </mat-icon> 
              Cancel
          </bb-button>
        </td>
        <td align="center" width="60%">&nbsp;</td>
        <td align="right" width="20%">
          <bb-button class = "filter-Buttons" [uxDesign]="'UX3'" [appearance]="'simple'" (click)="applyFilter($event);">
              <mat-icon><i class="material-icons filter-action filter-Buttons"> check </i> </mat-icon> 
              Apply
          </bb-button>          
          </td>
      </tr>
    </table>
  </div>
</div>
</ng-template>
