<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>Simple Editor</h1>
            <p>Please sign in to continue</p>
        </div>

        <div *ngIf="errorMessage" class="error-alert">
            {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="success-alert">
            {{ successMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <label for="userCode">User Code</label>
                <input
                    type="text"
                    id="userCode"
                    formControlName="userCode"
                    placeholder="Enter your user code"
                    [class.invalid]="loginForm.get('userCode')?.invalid && loginForm.get('userCode')?.touched"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    formControlName="password"
                    placeholder="Enter your password"
                    [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                >
            </div>

            <details class="editor-params" style="display: none;">
                <summary>Editor Parameters (Optional)</summary>
                <div class="params-content">
                    <div class="form-group">
                        <label for="objName">Object Name</label>
                        <input
                            type="text"
                            id="objName"
                            [(ngModel)]="objName"
                            [ngModelOptions]="{standalone: true}"
                            placeholder="e.g., sorder"
                        >
                    </div>
                    <div class="form-group">
                        <label for="editFlag">Edit Flag</label>
                        <input
                            type="text"
                            id="editFlag"
                            [(ngModel)]="editFlag"
                            [ngModelOptions]="{standalone: true}"
                            placeholder="A for Add, E for Edit"
                        >
                    </div>
                </div>
            </details>

            <button type="submit" [disabled]="isLoading || loginForm.invalid" class="login-button">
                <span *ngIf="isLoading" class="spinner"></span>
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading">Signing in...</span>
            </button>
        </form>
    </div>
</div>
